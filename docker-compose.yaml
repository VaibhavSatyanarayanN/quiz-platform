services:
  postgres:
    image: postgres:16
    container_name: quiz-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: TestUser
      POSTGRES_PASSWORD: Test@1234
      POSTGRES_DB: quiz_platform

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U TestUser -d quiz_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: quiz-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: